[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepdict"
version = "2.0.0"
description = "English-Chinese reading-aid dictionary generated with LLMs"
requires-python = ">=3.9"
dependencies = ["wordfreq==3.1.1"]

[project.optional-dependencies]
# Only needed to rebuild the Hacker News / Reddit candidate word lists.
wordlists = ["datasets", "huggingface_hub", "pyarrow"]

[tool.setuptools.packages.find]
include = ["deepdict*"]

[tool.setuptools.package-data]
deepdict = ["prompts/*.md"]
